apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cluster
  namespace: book-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: redis-cluster
  template:
    metadata:
      labels:
        app: redis-cluster
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        args:
          - "redis-server"
          - "--maxmemory"
          - "512mb"
          - "--maxmemory-policy"
          - "allkeys-lru"
          - "--tcp-keepalive"
          - "60"
          - "--timeout"
          - "300"
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster
  namespace: book-app
spec:
  selector:
    app: redis-cluster
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP