apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: book-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        args:
          - "redis-server"
          - "--maxmemory"
          - "1gb"
          - "--maxmemory-policy"
          - "allkeys-lru"
          - "--tcp-keepalive"
          - "60"
          - "--timeout"
          - "300"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: book-app
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP